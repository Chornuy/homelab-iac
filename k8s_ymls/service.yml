apiVersion: v1
kind: Service
metadata:
  name: my-service
  annotations:
    "lbipam.cilium.io/ips": "172.16.10.2"
  labels:
    io.cilium/bgp-advertisement: "true"
spec:
  selector:
    app: simple-pod  # Make sure this matches the label of the Pod
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 80
  type: LoadBalancer
