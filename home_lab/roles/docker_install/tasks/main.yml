---
- name: 1. Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: 2. Download Docker's official GPG key to the keyrings directory
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.gpg
    mode: '0644'
    owner: root
    group: root

- name: 3. Add the Docker APT repository source list
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('aarch64', 'arm64') | replace('armv7l', 'armhf') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: true
  register: repo_result

- name: Update apt cache if repository was added
  ansible.builtin.apt:
    update_cache: true
  when: repo_result.changed

- name: 6. Install Docker Engine and Docker Compose V2 plugin
  ansible.builtin.apt:
    name: "{{ docker_packages_to_install }}"
    state: present
    update_cache: true

- name: 7. Ensure Docker service is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: 8. Add specified user to the 'docker' group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true

- name: 9. Install Python 'docker' module for Ansible (Required for advanced modules like community.docker.docker_compose_v2)
  ansible.builtin.pip:
    name: docker
    state: present
    break_system_packages: true
  become: true