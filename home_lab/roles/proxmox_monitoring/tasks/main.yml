---
# --- 1. Install Node Exporter (Binary via systemd) ---
- name: 4. Create a dedicated system user for Node Exporter
  ansible.builtin.user:
    name: node_exporter
    shell: /sbin/nologin
    system: yes
    create_home: no

- name: 5. Download and unpack the Node Exporter binary
  ansible.builtin.unarchive:
    src: "{{ node_exporter_url }}"
    dest: /tmp
    remote_src: yes
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: 6. Move the binary to the execution path
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: "{{ node_exporter_path }}"
    owner: node_exporter
    group: node_exporter
    mode: '0755'
    remote_src: yes

- name: 7. Clean up the extracted temporary directory
  ansible.builtin.file:
    path: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"
    state: absent

- name: 8. Create systemd service file for Node Exporter
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=node_exporter
      Group=node_exporter
      Type=simple
      # The default 9100 port is used.
      # We add --collector.diskstats.device-exclude for cleaner virtualized monitoring
      ExecStart={{ node_exporter_path }} \
        --web.listen-address=:{{ node_exporter_port }} \
        --collector.textfile.directory=/var/lib/node_exporter/textfile_collector \
        --collector.diskstats.device-exclude='(loop|zd|ram|sr)[0-9]*'

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  notify: Reload systemd and restart node_exporter

- name: 9. Ensure the textfile collector directory exists
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: '0755'

- name: 10. Ensure Node Exporter service is running and enabled
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: yes
    daemon_reload: yes
