---
- name: 1. Deploy Prometheus Node Exporter as a Docker container
  community.docker.docker_container:
    name: node_exporter
    image: prom/node-exporter:{{ node_exporter_version }}
    state: started
    restart_policy: always
    user: root
    # Use 'host' network mode to expose metrics directly on the host's IP
    # This is essential for Prometheus to scrape it from outside the local compose network.
    network_mode: host
    # Volumes needed to expose host metrics to the container
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    # Node Exporter requires the '--path.*' arguments to read the host files
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
      - --web.listen-address={{ node_exporter_listen_address }}