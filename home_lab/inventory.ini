# --- ARCHITECTURE/OS GROUPS (Used for OS-specific tasks) ---

[armhf]
# ODROID-XU4 (uses ARMHF architecture)
odroid-xu4-1 ansible_host=192.168.0.78 ansible_python_interpreter=/usr/bin/python3.13
#odroid-xu4-2 ansible_host=192.168.0.92 ansible_python_interpreter=/usr/bin/python3.13

[aarch64]
# ODROID-C2 (uses AARCH64/ARM64 architecture)
odroid-c2-1 ansible_host=192.168.0.69 ansible_python_interpreter=/usr/bin/python3.13
odroid-c2-2 ansible_host=192.168.0.228 ansible_python_interpreter=/usr/bin/python3.13

[x86_64]
# Lenovo ThinkCentre M720q (uses x86-64 architecture)
proxmox-pve-node-1 ansible_host=192.168.20.10 ansible_python_interpreter=/usr/bin/python3.13
proxmox-pve-node-2 ansible_host=192.168.20.20 ansible_python_interpreter=/usr/bin/python3.13

# --- ROLE GROUPS (Used for service/functionality tasks) ---

[proxmox_nodes]
proxmox-pve-node-1
proxmox-pve-node-2

[odroid_c2]
# Add nodes that might handle media (e.g., Plex, Samba, NFS)
odroid-c2-1
odroid-c2-2

[odroid_xu4]
# General purpose nodes for smaller tasks, testing, etc.
odroid-xu4-1
;odroid-xu4-2

# --- META GROUPS (Grouping groups for easy management) ---

[servers:children]
armhf
aarch64
x86_64

[all_odroids:children]
armhf
aarch64

# --- VARIABLES (Define common variables for the whole inventory) ---

[all:vars]
ansible_user=root
# Use a separate user if you don't want to use root for security
# ansible_python_interpreter=/usr/bin/python3
# Required on some older systems, but usually unnecessary on modern DietPi/Proxmox

